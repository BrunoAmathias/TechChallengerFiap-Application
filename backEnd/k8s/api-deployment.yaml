apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: os

spec:
  replicas: 2

  selector:
    matchLabels:
      app: oficina-api

  template:
    metadata:
      labels:
        app: oficina-api

    spec:
      # Aplica as migrations antes da API subir. O node-pg-migrate usa advisory
      # lock no Postgres, então réplicas iniciando juntas não conflitam.
      initContainers:
        - name: migrate
          image: backend-api:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migrate:up"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

      containers:
        - name: api
          image: backend-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: api-config

          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_URL

            # Secrets "rabbitmq" e "service-auth" são criados pelo Terraform
            # (repo TechChallengerFiap-K8s) no namespace os.
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: RABBITMQ_URL

            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-auth
                  key: SERVICE_TOKEN

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET

            - name: MOCK_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MOCK_USER_EMAIL

            - name: MOCK_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MOCK_USER_PASSWORD

            - name: MOCK_USER_ID
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MOCK_USER_ID

            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: NEW_RELIC_LICENSE_KEY

            - name: NEW_RELIC_APP_NAME
              value: "oficina-api"

            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          # Liveness não depende do banco: uma queda do Neon tira o pod do
          # balanceamento (readiness) sem reiniciar o processo.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10