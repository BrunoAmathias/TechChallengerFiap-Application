apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: api-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-api

  minReplicas: 2
  maxReplicas: 10

  metrics:
  # Escala por CPU
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Escala por memória (requisito do trabalho: CPU/memória)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80