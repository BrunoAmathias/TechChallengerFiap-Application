name: CI/CD - Oficina API

on:
  push:
    branches: [ "master", "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oficina"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install
        working-directory: ./backEnd

      - name: Build da aplicação
        run: npm run build || echo "sem build"
        working-directory: ./backEnd

      - name: Rodar testes unitários
        run: npm run test:unit
        working-directory: ./backEnd

      - name: Rodar testes funcionais
        run: npm run test:functional
        working-directory: ./backEnd
        env:
          JWT_SECRET: test-secret
          MOCK_USER_EMAIL: ${{ secrets.MOCK_USER_EMAIL }}
          MOCK_USER_PASSWORD: ${{ secrets.MOCK_USER_PASSWORD }}
          MOCK_USER_ID: ${{ secrets.MOCK_USER_ID }}

      - name: Criar arquivo .env.test para CI
        working-directory: ./backEnd
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          DB_USER=postgres
          DB_HOST=127.0.0.1
          DB_NAME=oficina
          DB_PASSWORD=postgres
          DB_PORT=5432
          JWT_SECRET=test-secret
          MOCK_USER_EMAIL=${{ secrets.MOCK_USER_EMAIL }}
          MOCK_USER_PASSWORD=${{ secrets.MOCK_USER_PASSWORD }}
          MOCK_USER_ID=${{ secrets.MOCK_USER_ID }}
          EOF

      - name: Verificar conexão com PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d oficina && exit 0
            echo "Aguardando PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL não respondeu a tempo"
          exit 1
        env:
          PGPASSWORD: postgres

      - name: Inicializar banco de dados
        working-directory: ./backEnd
        run: |
          for file in db/init/*.sql; do
            echo "Executando $file"
            psql -h 127.0.0.1 -U postgres -d oficina -f "$file"
          done
        env:
          PGPASSWORD: postgres

      - name: Rodar testes integração
        run: npm run test:integration
        working-directory: ./backEnd

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/backend-api:latest ./backEnd

      - name: Push Docker
        run: |
          docker push ${{ secrets.DOCKER_USER }}/backend-api:latest

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3

      - name: Configurar kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config


      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f backEnd/k8s/
