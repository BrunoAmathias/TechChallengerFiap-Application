name: CD - Deploy Aplicação (main)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  EKS_CLUSTER_NAME: techchallenge-dev
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar acesso à AWS
        run: |
          aws sts get-caller-identity

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.status" \
            --output text

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          IMAGE_LATEST="$REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            -t "$IMAGE" \
            -t "$IMAGE_LATEST" \
            ./backEnd

          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Configurar kubectl para o cluster EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl config current-context
          kubectl get nodes

      - name: Validar manifests Kubernetes
        run: |
          kubectl apply \
            --dry-run=client \
            -f backEnd/k8s/api-configmap.yaml

          kubectl apply \
            --dry-run=client \
            -f backEnd/k8s/api-deployment.yaml

          kubectl apply \
            --dry-run=client \
            -f backEnd/k8s/api-service.yaml

          kubectl apply \
            --dry-run=client \
            -f backEnd/k8s/api-hpa.yaml

          kubectl apply \
            --dry-run=client \
            -f backEnd/k8s/ingress.yaml

      - name: Aplicar ConfigMap
        run: |
          kubectl apply -f backEnd/k8s/api-configmap.yaml

      - name: Validar secrets obrigatórios
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MOCK_USER_EMAIL: ${{ secrets.MOCK_USER_EMAIL }}
          MOCK_USER_PASSWORD: ${{ secrets.MOCK_USER_PASSWORD }}
          MOCK_USER_ID: ${{ secrets.MOCK_USER_ID }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          test -n "$DB_PASSWORD" || {
            echo "DB_PASSWORD não foi configurado"
            exit 1
          }

          test -n "$JWT_SECRET" || {
            echo "JWT_SECRET não foi configurado"
            exit 1
          }

          test -n "$MOCK_USER_EMAIL" || {
            echo "MOCK_USER_EMAIL não foi configurado"
            exit 1
          }

          test -n "$MOCK_USER_PASSWORD" || {
            echo "MOCK_USER_PASSWORD não foi configurado"
            exit 1
          }

          test -n "$MOCK_USER_ID" || {
            echo "MOCK_USER_ID não foi configurado"
            exit 1
          }

          test -n "$NEW_RELIC_LICENSE_KEY" || {
            echo "NEW_RELIC_LICENSE_KEY não foi configurado"
            exit 1
          }

          echo "Todos os secrets obrigatórios estão configurados."

      - name: Criar ou atualizar Secret da aplicação
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MOCK_USER_EMAIL: ${{ secrets.MOCK_USER_EMAIL }}
          MOCK_USER_PASSWORD: ${{ secrets.MOCK_USER_PASSWORD }}
          MOCK_USER_ID: ${{ secrets.MOCK_USER_ID }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          kubectl create secret generic api-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MOCK_USER_EMAIL="$MOCK_USER_EMAIL" \
            --from-literal=MOCK_USER_PASSWORD="$MOCK_USER_PASSWORD" \
            --from-literal=MOCK_USER_ID="$MOCK_USER_ID" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Validar Secret criado no Kubernetes
        run: |
          REQUIRED_KEYS=(
            "DB_PASSWORD"
            "JWT_SECRET"
            "MOCK_USER_EMAIL"
            "MOCK_USER_PASSWORD"
            "MOCK_USER_ID"
            "NEW_RELIC_LICENSE_KEY"
          )

          for KEY in "${REQUIRED_KEYS[@]}"; do
            VALUE="$(kubectl get secret api-secret \
              -o "jsonpath={.data.${KEY}}")"

            if [ -z "$VALUE" ]; then
              echo "Chave ausente no api-secret: $KEY"
              exit 1
            fi

            echo "Chave encontrada: $KEY"
          done

          SECRET_COUNT="$(kubectl get secret api-secret \
            -o go-template='{{len .data}}')"

          if [ "$SECRET_COUNT" -ne 6 ]; then
            echo "Quantidade inesperada de chaves no api-secret: $SECRET_COUNT"
            exit 1
          fi

          echo "api-secret validado com $SECRET_COUNT chaves."

      - name: Aplicar Deployment, Service, HPA e Ingress
        run: |
          kubectl apply -f backEnd/k8s/api-deployment.yaml
          kubectl apply -f backEnd/k8s/api-service.yaml
          kubectl apply -f backEnd/k8s/api-hpa.yaml
          kubectl apply -f backEnd/k8s/ingress.yaml

      - name: Atualizar imagem no Deployment
        run: |
          kubectl set image \
            deployment/oficina-api \
            api="${{ steps.build-image.outputs.image }}"

      - name: Aguardar rollout concluir
        run: |
          kubectl rollout status \
            deployment/oficina-api \
            --timeout=180s

      - name: Validar pods da aplicação
        run: |
          kubectl get pods \
            -l app=oficina-api \
            -o wide

          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app=oficina-api \
            --timeout=120s

      - name: Validar Service e Ingress
        run: |
          kubectl get service api-service
          kubectl get ingress api-ingress

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: |
          echo "===== Deployment ====="
          kubectl describe deployment oficina-api || true

          echo "===== ReplicaSets ====="
          kubectl get rs -l app=oficina-api -o wide || true

          echo "===== Pods ====="
          kubectl get pods -l app=oficina-api -o wide || true

          echo "===== Descrição dos pods ====="
          kubectl describe pods -l app=oficina-api || true

          echo "===== Logs atuais ====="
          kubectl logs \
            -l app=oficina-api \
            --all-containers=true \
            --tail=100 \
            --prefix=true || true

          echo "===== Logs anteriores ====="
          kubectl logs \
            -l app=oficina-api \
            --all-containers=true \
            --previous \
            --tail=100 \
            --prefix=true || true

          echo "===== Eventos recentes ====="
          kubectl get events \
            --sort-by=.metadata.creationTimestamp \
            | tail -100 || true