# Ambiente local. Senhas vêm do .env (veja .env.example); nada sensível fica versionado.
services:
  db:
    image: postgres:15
    container_name: Postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: oficina
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: RabbitMQ
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-oficina}
    ports:
      - "5672:5672"
      - "15672:15672" # painel: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Aplica as migrations (node-pg-migrate) antes de subir a API
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/oficina
    command: npm run migrate:up

  api:
    build: .
    container_name: API
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/oficina
      DB_SSL: "false"
      RABBITMQ_URL: amqp://oficina:${RABBITMQ_PASSWORD:-oficina}@rabbitmq:5672
    volumes:
      - .:/app
    command: npm run dev

  api-test:
    build: .
    container_name: API_Tests
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: test
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/oficina
      DB_SSL: "false"
      JWT_SECRET: test-secret
    volumes:
      - .:/app
    command: npx jest tests/integration

volumes:
  postgres_data:
