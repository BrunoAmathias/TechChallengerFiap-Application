apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: os

# api-secret.yaml NÃO entra: o Secret é gerado pelo cd.yml a partir dos GitHub Secrets
resources:
  - api-configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - ingress.yaml

# O cd.yml troca a imagem pela do ECR com a tag do commit
images:
  - name: backend-api
    newName: backend-api
    newTag: latest
