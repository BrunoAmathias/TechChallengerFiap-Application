version: '3.8'

services:
  db:
    image: postgres:15
    container_name: Postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bruninho28@
      POSTGRES_DB: oficina
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

  api:
    build: .
    container_name: API
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env 
    environment:
      DB_USER: postgres
      DB_HOST: db  
      DB_NAME: oficina
      DB_PASSWORD: Bruninho28@
      DB_PORT: 5432
    volumes:
      - .:/app
    command: npm run dev

  # NOVO SERVIÇO PARA TESTES
  api-test:
    build: .
    container_name: API_Tests
    depends_on:
      - db
    environment:
      - NODE_ENV=test
      - DB_USER=postgres
      - DB_HOST=db       # Host "db" para rede interna do Docker
      - DB_NAME=oficina
      - DB_PASSWORD=Bruninho28@
      - DB_PORT=5432
    volumes:
      - .:/app
    # Executa os testes e sai do container
    command: npm run test:integration

volumes:
  postgres_data: