apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: oficina-api

  template:
    metadata:
      labels:
        app: oficina-api

    spec:
      containers:
        - name: api
          image: backend-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: api-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET

            - name: MOCK_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MOCK_USER_EMAIL

            - name: MOCK_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MOCK_USER_PASSWORD

            - name: MOCK_USER_ID
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: MOCK_USER_ID

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10